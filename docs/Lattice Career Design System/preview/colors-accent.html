<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Color · accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { padding: 16px; }
.row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; margin-bottom: 8px; }
.row:last-child { margin-bottom: 0; }
.sw { border-radius: var(--radius-md); padding: 12px 14px; min-height: 64px; display: grid; gap: 4px; align-content: end; border: 1px solid var(--border-1); }
.sw .n { font: 500 12px/1.2 var(--font-sans); }
.sw .h { font: 400 11px/1.2 var(--font-mono); opacity: .72; }
.dk { color: var(--c-bone); }
.lt { color: var(--c-ink); }
</style></head>
<body>
<div class="row">
  <div class="sw dk" style="background:#1E3FFF"><span class="n">Cobalt — primary</span><span class="h">#1E3FFF · use sparingly</span></div>
  <div class="sw lt" style="background:#E6EBFF"><span class="n">Cobalt 50</span><span class="h">#E6EBFF</span></div>
</div>
<div class="row">
  <div class="sw lt" style="background:#D7E25C"><span class="n">Citron — high score</span><span class="h">#D7E25C · spotlight only</span></div>
  <div class="sw lt" style="background:#F4F7D6"><span class="n">Citron 50</span><span class="h">#F4F7D6</span></div>
</div>
<div class="row">
  <div class="sw dk" style="background:#5B2A86"><span class="n">Plum — skill gap</span><span class="h">#5B2A86 · growth area</span></div>
  <div class="sw lt" style="background:#EFE5F8"><span class="n">Plum 50</span><span class="h">#EFE5F8</span></div>
</div>
</body></html>
