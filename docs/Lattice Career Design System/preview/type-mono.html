<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type · mono &amp; eyebrow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { padding: 18px; display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--border-1); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.tag { font: 500 10px/1.2 var(--font-mono); letter-spacing: .05em; color: var(--fg-3); text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 400 12px/1 var(--font-mono); padding: 6px 10px; border-radius: var(--radius-sm); background: var(--c-cobalt-50); color: var(--c-cobalt); }
</style></head>
<body>
<div class="row"><span class="tag">Eyebrow</span><span class="lat-eyebrow">Explainability lab</span></div>
<div class="row"><span class="tag">Mono</span><span class="lat-mono">Java · SQL · Docker · Kubernetes</span></div>
<div class="row"><span class="tag">Mono xs</span><span class="lat-mono-xs">SKILL · ROLE · EXPERIENCE</span></div>
<div class="row"><span class="tag">As chips</span><div class="chips"><span class="chip">java</span><span class="chip">sql</span><span class="chip">docker</span><span class="chip">postgres</span></div></div>
</body></html>
