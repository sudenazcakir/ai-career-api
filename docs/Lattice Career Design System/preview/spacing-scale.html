<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { padding: 18px; display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 80px 1fr 60px; gap: 12px; align-items: center; }
.tag { font: 500 11px/1.2 var(--font-mono); color: var(--fg-3); }
.bar { height: 14px; background: var(--c-cobalt); border-radius: 3px; }
.value { font: 500 11px/1.2 var(--font-mono); color: var(--fg-3); text-align: right; }
</style></head>
<body>
<div class="row"><span class="tag">space-1</span><div class="bar" style="width:4px"></div><span class="value">4 px</span></div>
<div class="row"><span class="tag">space-2</span><div class="bar" style="width:8px"></div><span class="value">8 px</span></div>
<div class="row"><span class="tag">space-3</span><div class="bar" style="width:12px"></div><span class="value">12 px</span></div>
<div class="row"><span class="tag">space-4</span><div class="bar" style="width:16px"></div><span class="value">16 px</span></div>
<div class="row"><span class="tag">space-5</span><div class="bar" style="width:20px"></div><span class="value">20 px</span></div>
<div class="row"><span class="tag">space-6</span><div class="bar" style="width:24px"></div><span class="value">24 px</span></div>
<div class="row"><span class="tag">space-8</span><div class="bar" style="width:32px"></div><span class="value">32 px</span></div>
<div class="row"><span class="tag">space-10</span><div class="bar" style="width:40px"></div><span class="value">40 px</span></div>
<div class="row"><span class="tag">space-12</span><div class="bar" style="width:48px"></div><span class="value">48 px</span></div>
<div class="row"><span class="tag">space-16</span><div class="bar" style="width:64px"></div><span class="value">64 px</span></div>
</body></html>
