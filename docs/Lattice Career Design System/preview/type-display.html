<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type · display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { padding: 18px; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--border-1); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row:first-child { padding-top: 0; }
.tag { font: 500 10px/1.2 var(--font-mono); letter-spacing: .05em; color: var(--fg-3); text-transform: uppercase; }
</style></head>
<body>
<div class="row"><span class="tag">XL · 64</span><span class="lat-display-xl lat-italic">Build the lattice</span></div>
<div class="row"><span class="tag">LG · 48</span><span class="lat-display-lg">A career, cell by cell.</span></div>
<div class="row"><span class="tag">MD · 36</span><span class="lat-display-md">Application tracker</span></div>
</body></html>
