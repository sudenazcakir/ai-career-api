<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Color · base</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sw { border-radius: var(--radius-md); padding: 10px 12px; min-height: 86px; display: grid; gap: 4px; align-content: end; border: 1px solid var(--border-1); }
.sw .n { font: 500 12px/1.2 var(--font-sans); }
.sw .h { font: 400 11px/1.2 var(--font-mono); opacity: .72; }
.dk { color: var(--c-bone); }
.lt { color: var(--c-ink); }
</style></head>
<body>
<div class="grid">
  <div class="sw dk" style="background:#0E0E10"><span class="n">Ink</span><span class="h">#0E0E10</span></div>
  <div class="sw dk" style="background:#3A3A40"><span class="n">Graphite</span><span class="h">#3A3A40</span></div>
  <div class="sw dk" style="background:#6B6B72"><span class="n">Slate</span><span class="h">#6B6B72</span></div>
  <div class="sw lt" style="background:#A4A4AC"><span class="n">Mist</span><span class="h">#A4A4AC</span></div>
  <div class="sw lt" style="background:#F6F3EC"><span class="n">Bone</span><span class="h">#F6F3EC</span></div>
  <div class="sw lt" style="background:#FBFAF6"><span class="n">Paper</span><span class="h">#FBFAF6</span></div>
  <div class="sw lt" style="background:#FFFFFF"><span class="n">Chalk</span><span class="h">#FFFFFF</span></div>
  <div class="sw lt" style="background:#E8E3D7"><span class="n">Hairline</span><span class="h">#E8E3D7</span></div>
</div>
</body></html>
