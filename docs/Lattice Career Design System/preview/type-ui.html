<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type · UI scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { padding: 18px; }
.row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--border-1); }
.row:last-child { border-bottom: 0; }
.tag { font: 500 10px/1.2 var(--font-mono); letter-spacing: .05em; color: var(--fg-3); text-transform: uppercase; }
</style></head>
<body>
<div class="row"><span class="tag">H1 · 28/600</span><span class="lat-h1">Top recommendations</span></div>
<div class="row"><span class="tag">H2 · 22/600</span><span class="lat-h2">Selected CV</span></div>
<div class="row"><span class="tag">H3 · 17/600</span><span class="lat-h3">Match explanation</span></div>
<div class="row"><span class="tag">Body · 15</span><span class="lat-body">Import roles, select a CV, rank matches, and generate a learning path from missing skills.</span></div>
<div class="row"><span class="tag">Body sm · 13</span><span class="lat-body-sm">Backend Engineer · v1 · updated 2 days ago</span></div>
<div class="row"><span class="tag">Label · 12</span><span class="lat-label">Email address</span></div>
</body></html>
