<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Texture · dotted grid</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { padding: 0; background: var(--c-bone); height: 100%; }
.demo { padding: 20px; min-height: 200px; position: relative; overflow: hidden; }
.demo.bone { background-color: var(--c-bone); }
.dots { background-image: radial-gradient(rgba(164,164,172,.32) 1px, transparent 1px); background-size: 16px 16px; }
.numeral { position: absolute; right: 14px; bottom: -34px; font-family: var(--font-display); font-size: 200px; line-height: 1; color: var(--c-mist); opacity: .25; pointer-events: none; }
.eyebrow { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c-slate); margin-bottom: 12px; }
.h { font-family: var(--font-display); font-size: 36px; line-height: 1; color: var(--c-ink); }
.body { font: 400 13px/1.5 var(--font-sans); color: var(--c-graphite); margin-top: 8px; max-width: 360px; }
</style></head>
<body>
<div class="demo bone dots">
  <div class="eyebrow">Hero · auth · onboarding</div>
  <div class="h"><em style="font-style:italic">A career,</em> cell by cell.</div>
  <div class="body">Editorial layout — flat Bone background, 16-pixel dotted grid, oversize numeral. No stock photography.</div>
  <div class="numeral">07</div>
</div>
</body></html>
